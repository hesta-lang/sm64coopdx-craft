name: Package SteveCraft Mod

on:
  push:
    branches:
      - android
      - stevecraft-normal-mod-alpha
      - stevecraft-0.4.2-alpha
      - stevecraft-0.4.1-alpha
    paths:
      - "mods/stevecraft/actors/minecraft_steve_geo.bin"
      - "mods/stevecraft/main.lua"
      - "mods/stevecraft/README.md"
      - "mods/stevecraft/ENGINEERING_REVERSE_NOTES.md"
      - "tests/stevecraft_animation/**"
      - "tests/stevecraft_build_system/**"
      - "mods/stevecraft/systems/**"
      - "tools/stevecraft_assets/**"
      - "tools/stevecraft_rig_audit/**"
      - ".github/workflows/package-stevecraft-mod.yml"
  pull_request:
    branches:
      - stevecraft-normal-mod-alpha
    paths:
      - "mods/stevecraft/actors/minecraft_steve_geo.bin"
      - "mods/stevecraft/main.lua"
      - "mods/stevecraft/README.md"
      - "mods/stevecraft/ENGINEERING_REVERSE_NOTES.md"
      - "tests/stevecraft_animation/**"
      - "tests/stevecraft_build_system/**"
      - "mods/stevecraft/systems/**"
      - "tools/stevecraft_assets/**"
      - ".github/workflows/package-stevecraft-mod.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-mod:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua and ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip

      - name: Validate precompiled DynOS actor
        run: |
          ACTOR="mods/stevecraft/actors/minecraft_steve_geo.bin"
          test -s "$ACTOR"
          test "$(head -c 8 "$ACTOR")" = "DYNOSBIN"
          EXTRA_FILES="$(find mods/stevecraft/actors -type f ! -name 'minecraft_steve_geo.bin' ! -name 'README.md' -print)"
          test -z "$EXTRA_FILES"
          echo "Precompiled actor present: $(wc -c < "$ACTOR") bytes"

      - name: Extract official Minecraft Java HUD, block textures and sounds
        run: |
          python3 tools/stevecraft_assets/extract_official_assets.py \
            --version 26.3 \
            --output mods/stevecraft/assets

      - name: Validate Lua syntax
        run: |
          luac5.4 -p mods/stevecraft/main.lua
          find mods/stevecraft/systems -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p

      - name: Validate original Steve actor asset and construction runtime
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib

          actor = pathlib.Path("mods/stevecraft/actors/minecraft_steve_geo.bin").read_bytes()
          if not actor.startswith(b"DYNOSBIN"):
              raise SystemExit("Steve actor is not a valid DYNOSBIN asset.")
          if len(actor) < 1024:
              raise SystemExit("Steve actor file is unexpectedly small.")

          source = pathlib.Path("mods/stevecraft/main.lua").read_text(encoding="utf-8")
          required = (
              'local STEVECRAFT_VERSION = "0.4.2-alpha"',
              "Blocks.spawn_once(",
              "GRID_MAX_BLOCKS_PER_AREA = 128",
              "HOOK_MARIO_UPDATE",
              "HOOK_ON_HUD_RENDER",
              "HUD.render(",
          )
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit("Missing SteveCraft runtime markers: " + ", ".join(missing))

          print(
              "Steve DYNOSBIN asset validated: "
              f"{len(actor)} bytes, SHA-256 {hashlib.sha256(actor).hexdigest()}"
          )
          print("Construction grid, placement deduplication, and HUD hooks are present.")
          PY
          if grep -q 'smlua_model_util_get_id("mario_geo")' mods/stevecraft/main.lua; then
            echo "Unsafe built-in Mario fallback is still present."
            exit 1
          fi

      - name: Validate generated animation data
        run: lua5.4 tests/stevecraft_animation/test_animation.lua

      - name: Validate grid, inventory, and dynamic collision system
        run: lua5.4 tests/stevecraft_build_system/test_build_system.lua

      - name: Package standalone mod and engineering notes
        run: |
          cd mods/stevecraft
          zip -r "$GITHUB_WORKSPACE/SteveCraft-0.4.2-alpha.zip" main.lua README.md ENGINEERING_REVERSE_NOTES.md actors/minecraft_steve_geo.bin systems assets

      - name: Verify package contents
        run: |
          unzip -t SteveCraft-0.4.2-alpha.zip
          unzip -l SteveCraft-0.4.2-alpha.zip
          unzip -p SteveCraft-0.4.2-alpha.zip actors/minecraft_steve_geo.bin | head -c 8 | grep -q DYNOSBIN
          unzip -p SteveCraft-0.4.2-alpha.zip ENGINEERING_REVERSE_NOTES.md | grep -q "DynOS_Model_LoadGeo"

      - name: Upload standalone mod
        uses: actions/upload-artifact@v4
        with:
          name: SteveCraft-0.4.2-alpha
          path: SteveCraft-0.4.2-alpha.zip
          if-no-files-found: error
          retention-days: 14
