name: Minecraft Java Transpiler

on:
  workflow_dispatch:
  push:
    branches:
      - android
      - stevecraft-native-integration-alpha
    paths:
      - 'tools/minecraft_transpiler/**'
      - 'tests/minecraft_transpiler/**'
      - '.github/workflows/minecraft-transpiler.yml'
  pull_request:
    branches:
      - android
    paths:
      - 'tools/minecraft_transpiler/**'
      - 'tests/minecraft_transpiler/**'
      - '.github/workflows/minecraft-transpiler.yml'

permissions:
  contents: read

jobs:
  transpiler:
    name: Parse Java, generate Lua/C and validate outputs
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/minecraft_transpiler/requirements.txt
      - name: Install transpiler dependencies
        run: python -m pip install -r tools/minecraft_transpiler/requirements.txt
      - name: Run unit tests
        run: PYTHONPATH=tools/minecraft_transpiler python -m unittest discover -s tests/minecraft_transpiler -v
      - name: Transpile bundled Java fixture
        run: |
          python tools/minecraft_transpiler/mc2sm64.py \
            --input tools/minecraft_transpiler/examples/java \
            --out "$RUNNER_TEMP/mc2sm64-output" \
            --target both \
            --strict
      - name: Validate generated C
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -I "$RUNNER_TEMP/mc2sm64-output/c" \
            -fsyntax-only "$RUNNER_TEMP/mc2sm64-output/c"/*.c
      - name: Validate generated Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          luac5.4 -p "$RUNNER_TEMP/mc2sm64-output/lua"/*.lua
