name: Package SteveCraft Mod

on:
  push:
    branches:
      - android
      - stevecraft-normal-mod-alpha
      - stevecraft-0.4.2-alpha
      - stevecraft-0.4.5-alpha
      - stevecraft-0.4.6-alpha
      - stevecraft-0.4.8-alpha
      - stevecraft-0.4.1-alpha
    paths:
      - "mods/stevecraft/actors/minecraft_steve_geo.bin"
      - "mods/stevecraft/main.lua"
      - "mods/stevecraft/*.lua"
      - "mods/stevecraft/README.md"
      - "mods/stevecraft/ENGINEERING_REVERSE_NOTES.md"
      - "tests/stevecraft_animation/**"
      - "tests/stevecraft_build_system/**"
      - "tests/stevecraft_voxel_renderer/**"
      - "mods/stevecraft/systems/**"
      - "tools/stevecraft_assets/**"
      - "tools/stevecraft_rig_audit/**"
      - ".github/workflows/package-stevecraft-mod.yml"
  pull_request:
    branches:
      - stevecraft-normal-mod-alpha
    paths:
      - "mods/stevecraft/actors/minecraft_steve_geo.bin"
      - "mods/stevecraft/main.lua"
      - "mods/stevecraft/*.lua"
      - "mods/stevecraft/README.md"
      - "mods/stevecraft/ENGINEERING_REVERSE_NOTES.md"
      - "tests/stevecraft_animation/**"
      - "tests/stevecraft_build_system/**"
      - "tests/stevecraft_voxel_renderer/**"
      - "mods/stevecraft/systems/**"
      - "tools/stevecraft_assets/**"
      - ".github/workflows/package-stevecraft-mod.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-mod:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua and ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3 zip python3-pil

      - name: Validate precompiled DynOS actor
        run: |
          ACTOR="mods/stevecraft/actors/minecraft_steve_geo.bin"
          test -s "$ACTOR"
          test "$(head -c 8 "$ACTOR")" = "DYNOSBIN"
          EXTRA_FILES="$(find mods/stevecraft/actors -type f ! -name 'minecraft_steve_geo.bin' ! -name 'README.md' -print)"
          test -z "$EXTRA_FILES"
          echo "Precompiled actor present: $(wc -c < "$ACTOR") bytes"

      - name: Extract official Minecraft Java HUD, block textures and sounds
        run: |
          python3 tools/stevecraft_assets/extract_official_assets.py \
            --version 26.3 \
            --output mods/stevecraft/assets

      - name: Generate dedicated 3D inventory block icons
        run: |
          python3 tools/stevecraft_assets/generate_block_icons.py \
            --asset-root mods/stevecraft/assets

      - name: Embed official textures, isometric icons and sounds for production Lua
        run: |
          python3 tools/stevecraft_assets/embed_block_textures.py \
            --asset-root mods/stevecraft/assets \
            --output mods/stevecraft/embedded_block_textures.lua
          python3 tools/stevecraft_assets/embed_block_textures.py \
            --asset-root mods/stevecraft/assets \
            --output mods/stevecraft/systems/embedded_block_textures.lua

      - name: Validate Lua syntax
        run: |
          for file in mods/stevecraft/*.lua mods/stevecraft/systems/*.lua; do
            luac5.3 -p "$file"
          done

      - name: Validate Steve model payload and construction runtime
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import pathlib

          actor_path = pathlib.Path("mods/stevecraft/actors/minecraft_steve_geo.bin")
          actor = actor_path.read_bytes()
          model_source = pathlib.Path("mods/stevecraft/model.lua").read_text(encoding="utf-8")
          marker = "local STEVE_GEO_BASE64 = [["
          start = model_source.find(marker)
          if start < 0:
              raise SystemExit("Embedded Steve DYNOSBIN payload is missing from model.lua.")
          start += len(marker)
          end = model_source.find("]]", start)
          if end < 0:
              raise SystemExit("Embedded Steve DYNOSBIN payload is unterminated.")
          encoded = "".join(model_source[start:end].split())
          embedded = base64.b64decode(encoded, validate=True)
          if not actor.startswith(b"DYNOSBIN"):
              raise SystemExit("Steve actor file has an invalid DYNOSBIN header.")
          if embedded != actor:
              raise SystemExit("Embedded Steve model payload differs from actors/minecraft_steve_geo.bin.")

          for marker in ("STEVE_GEO_ASSET_REVISION", "mod_fs_create", "MOD_FS_URI_FORMAT"):
              if marker not in model_source:
                  raise SystemExit(f"Model loader is missing required marker: {marker}")

          main = pathlib.Path("mods/stevecraft/main.lua").read_text(encoding="utf-8")
          required = (
              'local STEVECRAFT_VERSION = "0.4.8-alpha"',
              'stevecraft_load_module("model", "model")',
          'stevecraft_load_module("systems/terrain_destruction", "systems/terrain_destruction")',
          "Terrain.delete_surface(surface)",
              "Blocks.spawn_once(",
              "GRID_MAX_BLOCKS_PER_AREA = 128",
              "HOOK_MARIO_UPDATE",
              "HOOK_ON_HUD_RENDER",
              "pcall(HUD.render,",
          )
          missing = [marker for marker in required if marker not in main]
          if missing:
              raise SystemExit("Missing SteveCraft runtime markers: " + ", ".join(missing))

          print(
              "Steve model payload verified: "
              f"{len(actor)} bytes, SHA-256 {hashlib.sha256(actor).hexdigest()}"
          )
          print("Model loader, construction grid, placement guard, and HUD hooks are present.")
          PY
          if grep -q 'smlua_model_util_get_id("mario_geo")' mods/stevecraft/model.lua; then
            echo "Unsafe built-in Mario fallback is still present."
            exit 1
          fi

      - name: Validate native engine bridge and placement input
        run: |
          grep -q "function Native.read_player_physics_state" mods/stevecraft/systems/native_engine.lua
          grep -q "function Native.find_surface_on_ray" mods/stevecraft/systems/native_engine.lua
          grep -q "sPlaceButtonLatched" mods/stevecraft/main.lua
          grep -q "X_BUTTON" mods/stevecraft/main.lua
          grep -q "native_engine = Native" mods/stevecraft/main.lua

      - name: Validate generated animation data
        run: lua5.3 tests/stevecraft_animation/test_animation.lua

      - name: Validate grid, inventory, and dynamic collision system
        run: lua5.3 tests/stevecraft_build_system/test_build_system.lua

      - name: Validate voxel renderer and embedded resources
        run: |
          lua5.3 tests/stevecraft_voxel_renderer/test_assets.lua
          lua5.3 tests/stevecraft_voxel_renderer/test_voxel_renderer.lua
          lua5.3 tests/stevecraft_voxel_renderer/test_section_updates.lua
          lua5.3 tests/stevecraft_voxel_renderer/test_terrain_destruction.lua
          python3 tests/stevecraft_voxel_renderer/test_embed_assets.py
          test -s mods/stevecraft/systems/grid_transform.lua
          test -s mods/stevecraft/systems/section_updates.lua
          test -s mods/stevecraft/systems/terrain_destruction.lua
          grep -q "Renderer.attach_surface_mask" mods/stevecraft/systems/voxel_renderer.lua
          grep -q "smlua_collision_delete_surface" mods/stevecraft/systems/terrain_destruction.lua
          grep -q "HOOK_ON_ADD_SURFACE" mods/stevecraft/main.lua
          test -s mods/stevecraft/embedded_block_textures.lua
          test -s mods/stevecraft/systems/embedded_block_textures.lua
          grep -q "G_CC_MODULATERGBA" mods/stevecraft/systems/voxel_renderer.lua
          grep -q "Renderer.compute_face_shading" mods/stevecraft/systems/voxel_renderer.lua
          grep -q "stevecraft_voxel_" mods/stevecraft/systems/voxel_renderer.lua
          grep -q "HOOK_BEFORE_GEO_PROCESS" mods/stevecraft/systems/voxel_renderer.lua

      - name: Validate footsteps, grid transform, and HUD resource paths
        run: |
          lua5.3 tests/stevecraft_voxel_renderer/test_audio.lua
          lua5.3 tests/stevecraft_voxel_renderer/test_grid_transform.lua
          lua5.3 tests/stevecraft_voxel_renderer/test_hud.lua
          grep -q "HOOK_ON_PLAY_SOUND" mods/stevecraft/main.lua
          grep -q "textures/stevecraft/icons/stone.png" mods/stevecraft/hud.lua
          grep -q "Sounds.reset_audio_cache" mods/stevecraft/sounds.lua
          grep -q "filter_mario_sounds" mods/stevecraft/main.lua
          grep -q "gsDPSetTextureFilter(G_TF_POINT)" mods/stevecraft/systems/voxel_renderer.lua
          grep -q "GridTransform.apply(obj, GRID_CELL_SIZE)" mods/stevecraft/main.lua
          ! grep -q 'textures/hud/hotbar' mods/stevecraft/hud.lua

      - name: Package standalone mod and engineering notes
        run: |
          cd mods/stevecraft
          zip -r "$GITHUB_WORKSPACE/SteveCraft-0.4.8-alpha.zip" main.lua assets.lua embedded_block_textures.lua model.lua blocks.lua camera.lua hud.lua physics.lua sounds.lua README.md ENGINEERING_REVERSE_NOTES.md actors/minecraft_steve_geo.bin systems assets

      - name: Verify package contents
        run: |
          unzip -t SteveCraft-0.4.8-alpha.zip
          python3 - <<'PY'
          import zipfile

          archive_path = "SteveCraft-0.4.8-alpha.zip"
          required_files = (
              "assets.lua",
              "embedded_block_textures.lua",
              "systems/assets.lua",
              "systems/embedded_block_textures.lua",
              "systems/voxel_renderer.lua",
              "systems/grid_transform.lua",
              "assets/textures/stevecraft/icons/stone.png",
              "assets/textures/stevecraft/icons/grass_block.png",
              "actors/minecraft_steve_geo.bin",
              "ENGINEERING_REVERSE_NOTES.md",
          )
          with zipfile.ZipFile(archive_path) as package:
              names = set(package.namelist())
              missing = [name for name in required_files if name not in names]
              if missing:
                  raise SystemExit("Missing package files: " + ", ".join(missing))
              actor = package.read("actors/minecraft_steve_geo.bin")
              if not actor.startswith(b"DYNOSBIN"):
                  raise SystemExit("Packaged Steve actor does not have a DYNOSBIN header.")
              manifest = package.read("embedded_block_textures.lua").decode("utf-8")
              if '["textures/stevecraft/icons/stone.png"]' not in manifest:
                  raise SystemExit("Root embedded manifest is missing generated block icons.")
              print(f"Verified {len(required_files)} required entries in {archive_path}.")
          PY

      - name: Upload standalone mod
        uses: actions/upload-artifact@v4
        with:
          name: SteveCraft-0.4.8-alpha
          path: SteveCraft-0.4.8-alpha.zip
          if-no-files-found: error
          retention-days: 14
