name: SteveCraft Research Pipeline

on:
  push:
    branches:
      - stevecraft-normal-mod-alpha
    paths:
      - "tools/minecraft_block_data/**"
      - "tests/minecraft_block_data/**"
      - ".github/workflows/stevecraft-research-pipeline.yml"
  pull_request:
    branches:
      - stevecraft-normal-mod-alpha
    paths:
      - "tools/minecraft_block_data/**"
      - "tests/minecraft_block_data/**"
      - ".github/workflows/stevecraft-research-pipeline.yml"
  workflow_dispatch:
    inputs:
      minecraft_version:
        description: "Minecraft Java release to inspect"
        required: true
        default: "26.3"
        type: string

permissions:
  contents: read

jobs:
  validate-extractor:
    name: Validate extractor, tests, and JSON schema
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Validate schema definition
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          with open("tools/minecraft_block_data/block-data.schema.json", encoding="utf-8") as stream:
              schema = json.load(stream)
          Draft202012Validator.check_schema(schema)
          print("JSON Schema Draft 2020-12 is valid.")
          PY

      - name: Run extractor unit tests
        env:
          PYTHONPATH: tools/minecraft_block_data
        run: python -m unittest discover -s tests/minecraft_block_data -v

  extract-and-validate-official-jar:
    name: Extract and validate official Minecraft client data
    needs: validate-extractor
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Resolve selected release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.minecraft_version }}
        run: |
          VERSION="${INPUT_VERSION:-26.3}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Minecraft Java target: $VERSION"

      - name: Download, SHA-1 verify, and extract official client JAR
        run: |
          python tools/minecraft_block_data/extract.py \
            --version "${{ steps.release.outputs.version }}" \
            --output "$RUNNER_TEMP/minecraft-block-data.json"

      - name: Validate extracted document against schema
        run: |
          python - <<'PY'
          import json
          import os
          from jsonschema import Draft202012Validator

          schema_path = "tools/minecraft_block_data/block-data.schema.json"
          output_path = os.path.join(os.environ["RUNNER_TEMP"], "minecraft-block-data.json")
          with open(schema_path, encoding="utf-8") as stream:
              schema = json.load(stream)
          with open(output_path, encoding="utf-8") as stream:
              document = json.load(stream)
          Draft202012Validator(schema).validate(document)
          coverage = document["coverage"]
          if coverage["blockstate_resource_count"] <= 0:
              raise SystemExit("No blockstate resources were extracted.")
          if coverage["block_model_resource_count"] <= 0:
              raise SystemExit("No block models were resolved.")
          if coverage["registry_complete"] is not False:
              raise SystemExit("The resource-only extractor must not claim registry completeness.")
          for block in document["blocks"]:
              if block["runtime_properties"]["status"] != "requires_java_runtime":
                  raise SystemExit(f"Runtime-only properties were incorrectly marked complete: {block['id']}")
          print("Schema validation passed.")
          print(json.dumps(coverage, indent=2))
          PY

      - name: Upload normalized metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteveCraft-Minecraft-${{ steps.release.outputs.version }}-Block-Metadata
          path: ${{ runner.temp }}/minecraft-block-data.json
          if-no-files-found: error
          retention-days: 7
