name: Package SteveCraft Mod

on:
  push:
    branches:
      - android
      - stevecraft-normal-mod-alpha
    paths:
      - "mods/stevecraft/actors/minecraft_steve_geo.bin"
      - "mods/stevecraft/main.lua"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-mod:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lua and ZIP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip

      - name: Validate precompiled DynOS actor
        run: |
          ACTOR="mods/stevecraft/actors/minecraft_steve_geo.bin"
          test -s "$ACTOR"
          test "$(head -c 8 "$ACTOR")" = "DYNOSBIN"
          EXTRA_FILES="$(find mods/stevecraft/actors -type f ! -name 'minecraft_steve_geo.bin' ! -name 'README.md' -print)"
          test -z "$EXTRA_FILES"
          echo "Precompiled actor present: $(wc -c < "$ACTOR") bytes"

      - name: Validate Lua syntax
        run: luac5.4 -p mods/stevecraft/main.lua

      - name: Package binary-only standalone mod
        run: |
          cd mods/stevecraft
          zip -r "$GITHUB_WORKSPACE/SteveCraft-0.2.1-alpha.zip" main.lua README.md actors/minecraft_steve_geo.bin

      - name: Verify package contents
        run: |
          unzip -l SteveCraft-0.2.1-alpha.zip
          unzip -p SteveCraft-0.2.1-alpha.zip actors/minecraft_steve_geo.bin | head -c 8 | grep -q DYNOSBIN

      - name: Upload standalone mod
        uses: actions/upload-artifact@v4
        with:
          name: SteveCraft-0.2.1-alpha
          path: SteveCraft-0.2.1-alpha.zip
          if-no-files-found: error
          retention-days: 14
